<img src="https://example.org/content/images/2026/09/workbench-lead.jpg" alt="Notes from the workbench: a season of small repairs"><p>Ghost’s RSS feed opens with the post’s feature image as a bare <code>img</code>, unsized and unwrapped, directly before the first paragraph. Everything after it is written by Ghost’s editor, which marks each rich block as a <code>kg-card</code>.</p>
