title = 'Caching the Slow Path: What We Learned Moving Our Search Index Closer to Readers'
body = '''
<p><em>By </em><a href="https://example.org/@avery.lind"><em>Avery Lind</em></a><em> and </em><a href="https://example.org/@tomas.reyes"><em>Tomás Reyes</em></a></p><h3>Introduction</h3><p>Most of our search queries are fast. A small share are not, and those few slow ones account for nearly all of the complaints. This post describes how we found them, why caching them was harder than it looked, and what the change did to latency for readers far from our data centers.</p><figure><img alt="" src="https://example.org/max/1024/1*search-latency-overview.png" /><figcaption>Query latency by percentile before the change. The long tail on the right is the slow path.</figcaption></figure><h3>Finding the slow path</h3><p>We started by sampling every query that took longer than a second and grouping them by shape. Three shapes covered 90 percent of the slow queries, and all three shared one expensive step: expanding a reader’s saved filters into a full query.</p><blockquote><em>If a query is slow because of the reader, not the content, the cache key has to be the reader.</em></blockquote><p>That observation shaped everything that followed. Here is the filter definition that expanded into the largest queries:</p><pre>{<br>  "filter": "saved",<br>  "owner": "reader:7f3a",<br>  "expand": ["topics", "authors", "publications", "followed_tags", "muted_tags", "language_preferences"],<br>  "limit": 50<br>}</pre><h4><strong>Why a plain cache did not work</strong></h4><p>A reader’s filters change rarely, but the content they match changes constantly. Caching the results would have served stale lists; caching only the expansion kept results fresh and removed the expensive step.</p><figure><img alt="" src="https://example.org/max/248/1*cache-key-formula.png" /><figcaption><em>The cache key: a hash of the reader’s filter set and its version, so any edit invalidates it.</em></figcaption></figure><ol><li><strong>Hash the filter set.</strong> Readers with identical filters share an entry.</li><li><strong>Version on edit.</strong> Any change to a filter bumps its version and misses the cache.</li><li><strong>Expire slowly.</strong> Entries live for a day, which is longer than most filters go unused.</li></ol><p>The rollout was gradual. We enabled the cache for one region at a time and compared latency against the regions still waiting:</p><figure><img alt="" src="https://example.org/max/1024/1*latency-by-region.jpeg" /><figcaption>Median and 99th-percentile latency by region, two weeks after rollout. Regions farthest from our data centers improved the most.</figcaption></figure><p>We also recorded a short walkthrough of the dashboards we used during the rollout:</p><figure><iframe src="https://example.org/widgets/media.html?src=https%3A%2F%2Fexample.org%2Fembed%2Fsearch-rollout&amp;display_name=Video&amp;type=text%2Fhtml&amp;schema=video" width="854" height="480" frameborder="0" scrolling="no"><a href="https://example.org/media/3b9f0e2c7d1a">https://example.org/media/3b9f0e2c7d1a</a></iframe></figure><h3>What we would do differently</h3><ul><li>Measure the slow path per region from the start; the global numbers hid the worst of it.</li><li>Build the invalidation first. Every bug we shipped was a stale entry.</li></ul><pre>curl -s "https://example.org/api/search?filter=saved&amp;owner=reader:7f3a&amp;expand=topics,authors,publications,followed_tags,muted_tags,language_preferences&amp;limit=50" | jq '.results | length'</pre><h3>Acknowledgements</h3><p>Thanks to <a href="https://example.org/@jun.park"><em>Jun Park</em></a> for the latency dashboards and <a href="https://example.org/@lena.koch"><em>Lena Koch</em></a> for reviewing the invalidation design.</p><img src="https://example.org/_/stat?event=post.clientViewed&referrerSource=full_rss&postId=5e1a0c9b7d2f" width="1" height="1" alt=""><hr><p><a href="https://example.org/field-notes/caching-the-slow-path-5e1a0c9b7d2f">Caching the Slow Path: What We Learned Moving Our Search Index Closer to Readers</a> was originally published in <a href="https://example.org/field-notes">Field Notes</a> on Medium, where people are continuing the conversation by highlighting and responding to this story.</p>'''
